name: Tests and coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VOCALOCATE_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        id: dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e 'pipeline[dev]' -e 'demo[dev]' 'pytest-cov>=6'
      - name: Test pipeline
        working-directory: pipeline
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.pipeline
        run: python -m pytest -q --cov --cov-config=../.coveragerc --cov-report=
      - name: Test demo
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: demo
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.demo
        run: python -m pytest -q --cov --cov-config=../.coveragerc --cov-report=
      - name: Combine and report
        run: |
          python -m coverage combine "$RUNNER_TEMP/.coverage.pipeline" "$RUNNER_TEMP/.coverage.demo"
          python -m coverage report
          python -m coverage json -o coverage.json
          python - <<'PY' > coverage.md
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))

          def pct(covered, total):
              return 100 * covered / total if total else 100.0

          print("| Python source | Lines | Line coverage | Branches | Branch coverage |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for label, prefix in (
              ("Pipeline", "pipeline/vocalocate_pipeline/"),
              ("Demo", "demo/src/vocalocate_demo/"),
              ("Modal training", "demo/modal/"),
          ):
              files = [
                  entry["summary"] for name, entry in report["files"].items()
                  if name.startswith(prefix)
              ]
              lines = sum(entry["num_statements"] for entry in files)
              if not lines:
                  raise SystemExit(f"No executable Python lines found for {label}.")
              hit = sum(entry["covered_lines"] for entry in files)
              branches = sum(entry["num_branches"] for entry in files)
              taken = sum(entry["covered_branches"] for entry in files)
              print(f"| {label} | {hit}/{lines} | {pct(hit, lines):.2f}% | "
                    f"{taken}/{branches} | {pct(taken, branches):.2f}% |")
          t = report["totals"]
          line_pct = pct(t["covered_lines"], t["num_statements"])
          branch_pct = pct(t["covered_branches"], t["num_branches"])
          print(f'| **Combined** | {t["covered_lines"]}/{t["num_statements"]} | **{line_pct:.2f}%** | '
                f'{t["covered_branches"]}/{t["num_branches"]} | **{branch_pct:.2f}%** |')
          print()

          # README badge, refreshed on main together with the table.
          def floor1(x):  # round down, so 99.97% never shows as 100%
              return f"{int(x * 10) / 10:g}"

          worst = min(line_pct, branch_pct)
          color = "brightgreen" if worst >= 95 else "yellowgreen" if worst >= 80 else "orange"
          label = f"{floor1(line_pct)}%25 lines | {floor1(branch_pct)}%25 branches"
          label = label.replace(" ", "%20").replace("|", "%7C")
          Path("badge.md").write_text(
              f"[![Coverage](https://img.shields.io/badge/coverage-{label}-{color})](#code-coverage)\n",
              encoding="utf-8",
          )
          print("Scope: first-party VocaLocate Python code. Frontend JavaScript coverage is unmeasured. "
                "Terraform is checked separately by the infra workflow. "
                "Vendored EfficientAT and the A3/A4 Nanochat experiments are excluded.")
          PY
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            coverage.json
            coverage.md
            badge.md
          if-no-files-found: error

  gate:
    # A separate job, so the PR comment and README still update when coverage drops:
    # reviewers see the new numbers, and this check turns red.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-coverage
      - name: Require 100% line and branch coverage
        run: |
          python - <<'PY'
          import json, sys
          t = json.load(open("coverage.json", encoding="utf-8"))["totals"]
          missing = {
              "lines": t["num_statements"] - t["covered_lines"],
              "branches": t["num_branches"] - t["covered_branches"],
          }
          print(f"uncovered: {missing}")
          if any(missing.values()):
              sys.exit("Coverage fell below 100%. See the coverage table for the files that need tests.")
          PY

  comment:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-coverage
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- vocalocate-coverage -->';
            const issue = { ...context.repo, issue_number: context.issue.number };
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Code coverage\n\n${fs.readFileSync('coverage.md', 'utf8').trim()}\n\n[Coverage report and CI run](${run})`;
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

  readme:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: code-coverage
      - name: Update README on main
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main has advanced. Its latest workflow will publish coverage."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          for name, source in (("coverage", "coverage.md"), ("coverage-badge", "badge.md")):
              start, end = f"<!-- {name}:start -->", f"<!-- {name}:end -->"
              before, after = text.split(start)
              _, after = after.split(end)
              block = Path(source).read_text(encoding="utf-8").strip()
              text = f"{before}{start}\n{block}\n{end}{after}"
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git add README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: refresh coverage report'
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
              exit 1
            fi
            echo "main has advanced. Its latest workflow will publish coverage."
          fi
